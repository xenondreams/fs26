<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Press to Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#14121a;
    --bg-1:#1f1b2e;
    --panel:#252036;
    --cream:#f5f0e8;
    --cream-dim:#b9b2c4;
    --gold:#ffd25a;
    --teal:#2fbf9f;
    --amber:#f2a93b;
    --magenta:#e8449b;
    --crimson:#e8543f;
    --shadow-deep: rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:
      radial-gradient(circle at 50% -10%, rgba(255,210,90,0.10), transparent 55%),
      var(--bg-0);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  .stage{
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    padding:36px 20px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .marquee{
    text-align:center;
    margin-bottom:8px;
  }
  .marquee p{
    color:var(--cream-dim);
    font-size:14px;
    margin:0;
  }


  .player{
    width:100%;
    margin-bottom:26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .sound-btn{
    border:none;
    cursor:pointer;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    color:#1a1420;
    background:linear-gradient(180deg, #ffe58f, var(--gold));
    padding:10px 22px;
    border-radius:999px;
    box-shadow:0 5px 0 #b8902a, 0 10px 18px -8px rgba(255,210,90,0.5);
    transition:transform 0.08s ease, box-shadow 0.08s ease;
  }
  .sound-btn:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 #b8902a, 0 4px 10px -6px rgba(255,210,90,0.5);
  }

  .panel{
    width:100%;
    margin-top:32px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.12)),
      var(--bg-1);
    border-radius:28px;
    padding:26px 20px 30px;
    box-shadow:
      0 30px 60px -20px var(--shadow-deep),
      inset 0 1px 0 rgba(255,255,255,0.06);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px 14px;
  }

  .btn{
    position:relative;
    border:none;
    width:100%;
    padding:20px 12px;
    min-height:130px;
    border-radius:20px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:17px;
    line-height:1.15;
    color:#1a1420;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:10px;
    transform:translateY(0);
    transition:transform 0.08s ease, box-shadow 0.08s ease;
    text-decoration:none;
  }
  .btn .icon{
    font-size:32px;
    line-height:1;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,0.25));
  }
  .btn .label-wrap{display:flex; flex-direction:column; gap:2px; align-items:center;}
  .btn .sub{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:12px;
    color:rgba(26,20,32,0.65);
  }
  .btn.founder{ background: linear-gradient(180deg, #f16bb4, var(--magenta)); box-shadow: 0 8px 0 #a02566, 0 14px 24px -8px rgba(232,68,155,0.5);}
  .btn.song1{ background: linear-gradient(180deg, #ff8168, var(--crimson)); box-shadow: 0 8px 0 #a5301f, 0 14px 24px -8px rgba(232,84,63,0.5);}
  .btn.song2{ background: linear-gradient(180deg, #4fe3c1, var(--teal)); box-shadow: 0 8px 0 #1e8a70, 0 14px 24px -8px rgba(47,191,159,0.5);}
  .btn.video3{ background: linear-gradient(180deg, #7fb8ff, #4a8fe0); box-shadow: 0 8px 0 #2f62a3, 0 14px 24px -8px rgba(74,143,224,0.5);}
  .btn.skiball{ background: linear-gradient(180deg, #b79bff, #8a63e8); box-shadow: 0 8px 0 #5a3aa8, 0 14px 24px -8px rgba(138,99,232,0.5);}
  .btn.music{ background: linear-gradient(180deg, #ffe58f, var(--gold)); box-shadow: 0 8px 0 #b8902a, 0 14px 24px -8px rgba(255,210,90,0.5);}
  .btn.mean{ background: linear-gradient(180deg, #ff9ac7, #ff6fa8); box-shadow: 0 8px 0 #b03a6c, 0 14px 24px -8px rgba(255,111,168,0.5);}
  .btn.sat{ background: linear-gradient(180deg, #ffc766, var(--amber)); box-shadow: 0 8px 0 #b87914, 0 14px 24px -8px rgba(242,169,59,0.5);}

  .panel .btn:last-child:nth-child(odd){ grid-column:1 / -1; }

  .btn:active{
    transform:translateY(6px);
  }
  .btn.founder:active{ box-shadow: 0 2px 0 #a02566, 0 6px 14px -6px rgba(232,68,155,0.5); }
  .btn.song1:active{ box-shadow: 0 2px 0 #a5301f, 0 6px 14px -6px rgba(232,84,63,0.5); }
  .btn.song2:active{ box-shadow: 0 2px 0 #1e8a70, 0 6px 14px -6px rgba(47,191,159,0.5); }
  .btn.video3:active{ box-shadow: 0 2px 0 #2f62a3, 0 6px 14px -6px rgba(74,143,224,0.5); }
  .btn.skiball:active{ box-shadow: 0 2px 0 #5a3aa8, 0 6px 14px -6px rgba(138,99,232,0.5); }
  .btn.music:active{ box-shadow: 0 2px 0 #b8902a, 0 6px 14px -6px rgba(255,210,90,0.5); }
  .btn.mean:active{ box-shadow: 0 2px 0 #b03a6c, 0 6px 14px -6px rgba(255,111,168,0.5); }
  .btn.sat:active{ box-shadow: 0 2px 0 #b87914, 0 6px 14px -6px rgba(242,169,59,0.5); }

  .readout{
    margin-top:26px;
    width:100%;
    min-height:120px;
    background:#0e0c14;
    border-radius:20px;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    border:1px solid rgba(255,210,90,0.15);
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.6);
  }
  .readout .idle{
    color:var(--cream-dim);
    font-size:13px;
    letter-spacing:0.05em;
  }
  .readout .fortune{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:19px;
    line-height:1.3;
    color:var(--gold);
  }
  .blinking{
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink{
    50%{ opacity:0.35; }
  }
  @media (prefers-reduced-motion: reduce){
    .blinking{ animation:none; }
    .btn{ transition:none; }
  }

  footer{
    margin-top:28px;
    font-size:11px;
    color:rgba(185,178,196,0.5);
    text-align:center;
    letter-spacing:0.04em;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="player">
    <audio id="bgaudio" src="FS2026%20BASE%20INST%20ONLY.mp3" loop preload="auto"></audio>
    <button class="sound-btn" id="soundBtn" type="button">🔊 FSW26 Theme Song (Instruments Only) </button>
  </div>

  <div class="panel">
    <a class="btn skiball" href="skiball.html">
      <span class="icon">🎯</span>
      <span class="label-wrap">Ski Ball Challenge<span class="sub">IRL prizes</span></span>
    </a>

    <a class="btn sat" href="sat.html">
      <span class="icon">🧠</span>
      <span class="label-wrap">Guess Our SAT Scores<span class="sub">IRL prizes</span></span>
    </a>

    <a class="btn founder" href="amessage.mp4" target="_blank">
      <span class="icon">🎥</span>
      <span class="label-wrap">A Message from Our Founder</span>
    </a>

    <a class="btn song1" href="https://youtu.be/kubLpKBBPm8?si=GsPLnzArP6wsvOeY&t=334" target="_blank" rel="noopener">
      <span class="icon">🎵</span>
      <span class="label-wrap">Having a Brew</span>
    </a>

    <a class="btn song2" href="https://youtu.be/vUB8gKoyGbc?si=7ptYAlrHqvZoQzBj&t=141" target="_blank" rel="noopener">
      <span class="icon">🎵</span>
      <span class="label-wrap">CTCNTNGT Theme Song</span>
    </a>

    <a class="btn video3" href="https://youtu.be/1xwEj41lspI?si=7CG7X__-6k5JR4Rk" target="_blank" rel="noopener">
      <span class="icon">▶️</span>
      <span class="label-wrap">General Ethos</span>
    </a>

    <a class="btn music" href="https://www.tiktok.com/@keyboardshort" target="_blank" rel="noopener">
      <span class="icon">🎹</span>
      <span class="label-wrap">UNLIMITED MUSIC</span>
    </a>

    <a class="btn mean" href="https://youtu.be/oaAMjh0ufD4?si=ASmdrTmbVVdcQqqw" target="_blank" rel="noopener">
      <span class="icon">❓</span>
      <span class="label-wrap">What Does This Mean</span>
    </a>
  </div>

</div>


<script>
  const a = document.getElementById('bgaudio');
  const b = document.getElementById('soundBtn');
  let started = false;

  function setPlaying(on){
    b.textContent = on ? '🔇 Pause the music' : '🔊 Play the music';
  }

  function tryStart(){
    if (started) return;
    const p = a.play();
    if (p && p.then) {
      p.then(function(){ started = true; setPlaying(true); removeGestureListeners(); })
       .catch(function(){ /* blocked until the person taps */ });
    }
  }

  function removeGestureListeners(){
    document.removeEventListener('click', tryStart);
    document.removeEventListener('touchend', tryStart);
    document.removeEventListener('keydown', tryStart);
  }

  // Try right away (works on some desktop browsers), otherwise start on the first tap anywhere.
  tryStart();
  document.addEventListener('click', tryStart);
  document.addEventListener('touchend', tryStart);
  document.addEventListener('keydown', tryStart);

  b.addEventListener('click', function(e){
    e.stopPropagation();
    if (a.paused) {
      a.play();
      started = true;
      removeGestureListeners();
      setPlaying(true);
    } else {
      a.pause();
      started = true;
      removeGestureListeners();
      setPlaying(false);
    }
  });
</script>

</body>
</html>
